[general]
daemon = false
log_level = info
log_file = logs/zigbee_mesh.log

[device]
role = 2
ieee_address = 0x0000000000000000
short_address = 0xFFFF

[network]
pan_id = 0x1234
channel = 11
nwk_update_id = 0

[radio]
type = MRF24J40
backend = SPI
device_path = /dev/spidev0.0
baud_rate = 1000000
tx_power = 0
auto_ack = true
promiscuous = false

[security]
security_enabled = false
trust_center = false
require_auth = true
allow_open_join = false

[storage]
db_path = data/zigbee_mesh.db
backup_path = data/backup/

[mesh]
heartbeat_interval = 15000
node_timeout = 60000
route_timeout = 120000
max_depth = 30

[cli]
prompt = "zigbee> "
history_size = 100
